name: PhishMe
description: 'PhishMe is a phishing defense and security awareness company founded in 2011 by Rohyt Belani
  and Aaron Higbee, and rebranded as Cofense in 2018 following its acquisition by a private-equity consortium.
  The company pioneered simulated-phishing training and crowd-sourced phishing detection, and today operates
  the Cofense phishing-defense platform spanning Phishing Detection and Response (PDR), security awareness
  training, managed phishing defense, and threat intelligence. Originally backed by Bessemer Venture Partners,
  it was added to the API Evangelist network as a portfolio-company lead. The company markets a connected,
  AI-assisted platform for post-perimeter phishing remediation rather than a public developer API; product,
  integration, and threat-intelligence capabilities are surfaced through customer and partner channels.'
